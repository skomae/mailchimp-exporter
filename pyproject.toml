[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailchimp-exporter"
version = "0.1.0"
description = "Export all of your own Mailchimp account data through the official Marketing API (OAuth 2 or API key)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mailchimp-exporter = "mailchimp_exporter.cli:main"

[tool.setuptools]
packages = ["mailchimp_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
